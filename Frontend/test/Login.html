<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
        <h1>Login</h1>
    <div class="Cls-Login">

  
  

        <form>

            <label for="Email">Email</label>

            <input
                type="email"
                id="Email"
                placeholder="example@gmail.com"
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >

            <button type="submit">
                Enter
            </button>

            <p>
                Don't Have Account:
                <a href="./Createaccount.html">
                    Create Account
                </a>
            </p>

        </form>

    </div>

    <script src="Script.js"></script>

</body>

</html>
